name: Build Fatima Games APK

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite rodar manualmente pela UI do GitHub
  release:
    types: [created]

# Necessário para o workflow criar/atualizar a Release com o APK.
permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
        continue-on-error: true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fatima-games-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Renomeia para um nome amigável usado no link de download do site.
      - name: Prepare APK for release
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk FatimaGames.apk

      # Publica/atualiza a release "latest" com o APK mais recente.
      # Cria a URL pública estável:
      #   https://github.com/caioross/FatimaGames/releases/latest/download/FatimaGames.apk
      - name: Publish APK to "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FatimaGames — última versão (APK)
          body: |
            APK mais recente do FatimaGames, gerado automaticamente a cada atualização.

            Baixe **FatimaGames.apk** abaixo, transfira para o celular e instale
            (pode ser necessário autorizar "Fontes desconhecidas").
          make_latest: true
          files: FatimaGames.apk

      # Mantém o comportamento antigo: se você criar uma release manual, anexa o APK também.
      - name: Attach APK to manual release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
